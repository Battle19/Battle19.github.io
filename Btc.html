<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
 
  <style>
    :root {
        --primary: #28a745;
        --primary-dark: #218838;
        --light-bg: #ffffff;
        --light-gray: #f8f9fa;
        --text-dark: #212529;
        --text-gray: #495057;
        --border: #dee2e6;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--light-bg);
        color: var(--text-dark);
        line-height: 1.6;
    }

    .container {
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 15px;
    }

    header {
        background: white;
        border-bottom: 1px solid var(--border);
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    header .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo img {
        height: 42px;
    }

    nav a {
        margin-left: 24px;
        color: var(--text-dark);
        text-decoration: none;
        font-weight: 500;
    }

    nav a:hover {
        color: var(--primary);
    }

    .auth-buttons .btn {
        padding: 8px 20px;
        font-size: 0.95rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
    }

    .btn-outline {
        background: white;
        border: 1px solid var(--primary);
        color: var(--primary);
    }

    .btn-primary {
        background: var(--primary);
        color: white;
    }

    .hero {
        background: var(--light-gray);
        padding: 90px 0 70px;
        text-align: center;
    }

    .hero h1 {
        font-size: 3.2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: var(--text-dark);
    }

    .hero .subtitle {
        font-size: 1.35rem;
        color: var(--text-gray);
        max-width: 680px;
        margin: 0 auto 2rem;
    }

    .hero .btn-primary {
        padding: 14px 48px;
        font-size: 1.2rem;
        border-radius: 8px;
    }

    .quick-teaser {
        padding: 60px 0;
    }

    .quick-teaser h2 {
        text-align: center;
        font-size: 2.2rem;
        margin-bottom: 2.5rem;
    }

    .quick-teaser .intro {
        text-align: center;
        color: var(--text-gray);
        max-width: 760px;
        margin: 0 auto 3rem;
        font-size: 1.1rem;
    }

    .action-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
    }

    .action-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 30px 20px;
        text-align: center;
        transition: border-color 0.2s, box-shadow 0.2s;
        cursor: pointer;
    }

    .action-card:hover {
        border-color: var(--primary);
        box-shadow: 0 6px 16px rgba(40,167,69,0.12);
    }

    .action-card i {
        font-size: 2.6rem;
        color: var(--primary);
        margin-bottom: 1.2rem;
    }

    .action-card h3 {
        font-size: 1.4rem;
        margin-bottom: 0.7rem;
    }

    .action-card p {
        color: var(--text-gray);
        font-size: 0.98rem;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin: 40px 0;
    }

    .stat-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 24px;
        text-align: center;
    }

    .stat-card h3 {
        color: var(--text-gray);
        font-size: 1rem;
        margin-bottom: 0.5rem;
    }

    .num {
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--primary);
    }

    .cta-section {
        padding: 80px 0;
        background: var(--light-gray);
        text-align: center;
    }

    .cta-section h2 {
        font-size: 2.4rem;
        margin-bottom: 1.2rem;
    }

    .cta-section p {
        font-size: 1.2rem;
        color: var(--text-gray);
        max-width: 620px;
        margin: 0 auto 2rem;
    }

    .payouts-section h2 {
        font-size: 1.8rem;
        margin: 3rem 0 2rem;
        text-align: center;
    }

    .payout-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
    }

    .payout-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 18px;
        text-align: center;
    }

    .payout-card .amt {
        font-size: 1.6rem;
        font-weight: 700;
        color: #28a745;
    }

    .payout-card .user, .payout-card .meta {
        color: var(--text-gray);
    }

    .winners-teaser {
        margin: 50px auto;
        max-width: 900px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 30px;
    }

    .winners-teaser h3 {
        text-align: center;
        margin-bottom: 1.8rem;
    }

    footer {
        background: #343a40;
        color: white;
        padding: 50px 0 30px;
        text-align: center;
    }

    .footer-content {
        display: flex;
        justify-content: center;
        gap: 60px;
        flex-wrap: wrap;
        margin-bottom: 2rem;
    }

    footer a {
        color: #adb5bd;
        text-decoration: none;
    }

    footer a:hover {
        color: white;
    }

    .copyright {
        font-size: 0.9rem;
        color: #6c757d;
    }

    .refresh-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background 0.3s ease;
        margin-top: 20px;
    }

    .refresh-btn:hover {
        background: var(--primary-dark);
    }

    .refresh-btn i {
        margin-right: 8px;
    }
    
    .load-more-btn {
        display: inline-block;
        background: linear-gradient(90deg, #28a745, #34ce57);
        color: white;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 1rem;
        padding: 14px 40px;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        transition: all 0.3s ease;
    }
    
    .load-more-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    
    .load-more-btn i {
        margin-left: 10px;
        font-size: 0.9rem;
    }
    
    .load-more-status {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #6c757d;
    }

    @media (max-width: 768px) {
        .hero h1 { font-size: 2.4rem; }
        .hero .subtitle { font-size: 1.15rem; }
        header .container { flex-direction: column; gap: 12px; }
        nav { margin: 10px 0; }
    }
</style>
</head>
